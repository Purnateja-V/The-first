<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p::first-line{
            color: brown;
        }
        p::first-letter{
            color: blueviolet;
            font-size: 100px;
        }
        button{
            display:flex;
            align-items: center;
            justify-content:center;
        }
        
    </style>
</head>
<body>
    
     
    <button>toggle here</button>
    <script>
        document.queryselector("button").addeventlistener('click',function(){
            console.log(document);//<doctype> <html>...
            console.log(document.body);//<html>
            console.log(document.body.classlist);//<body>
            console.log(document.body.classlist);//styles applied on body element
            document.body.classlist.toggle('dark-theme')});
        
    </script>
    
</body>
</html>
